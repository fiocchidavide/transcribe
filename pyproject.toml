[project]
name = "transcribe"
version = "0.1.0"
description = "Turn any audio- or video-bearing file (or URL) into text with Whisper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
# Force either backend in regardless of platform.
mlx = ["mlx-whisper"]
faster = ["faster-whisper"]

[project.scripts]
transcribe = "transcribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]
